services:
  db:
    build: ./db
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weathergpt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weathergpt_password}
      POSTGRES_DB: ${POSTGRES_DB:-weathergpt}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weathergpt} -d ${POSTGRES_DB:-weathergpt}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: .
    env_file: .env
    environment:
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment: {VITE_API_URL: http://localhost:8000/api/v1}
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
