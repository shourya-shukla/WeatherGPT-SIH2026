services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: weathergpt
      POSTGRES_USER: weathergpt
      POSTGRES_PASSWORD: weathergpt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weathergpt"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [postgres_data:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://weathergpt:weathergpt@db:5432/weathergpt
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment: {VITE_API_URL: http://localhost:8000/api/v1}
    ports: ["5173:5173"]
    depends_on: [backend]
volumes: {postgres_data: {}}
